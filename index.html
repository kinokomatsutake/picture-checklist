<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f6f6">
  <title>Picture Checklist</title>
  <style>
    :root { color-scheme: light; --bg:#f6f6f6; --ink:#202020; --muted:#777; --line:#e4e4e4; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .wrap { width:min(1500px, 100%); margin:0 auto; padding:24px clamp(12px, 2.5vw, 36px) 48px; }
    header { position:sticky; top:0; z-index:5; background:rgba(246,246,246,.94); backdrop-filter:blur(10px); padding:12px 0 18px; }
    .topline { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    h1 { font-size:clamp(20px,3vw,28px); margin:0; font-weight:700; letter-spacing:-.03em; }
    .progress-area { display:flex; align-items:center; gap:12px; min-width:min(100%, 330px); }
    #counter { color:var(--muted); font-size:14px; white-space:nowrap; font-variant-numeric:tabular-nums; }
    .track { height:8px; flex:1; min-width:80px; background:#e2e2e2; border-radius:99px; overflow:hidden; }
    #bar { height:100%; width:0; background:#333; border-radius:99px; transition:width .2s ease; }
    .actions { display:flex; gap:8px; align-items:center; }
    button { border:1px solid #d5d5d5; background:#fff; color:#333; padding:8px 12px; border-radius:9px; font:inherit; font-size:13px; cursor:pointer; }
    button:hover { background:#f0f0f0; }
    button:focus-visible, .tile:focus-visible { outline:3px solid #6b9cff; outline-offset:2px; }
    #grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; }
    .tile { display:block; position:relative; overflow:hidden; padding:0; border:0; border-radius:8px; background:#e9e9e9; cursor:pointer; aspect-ratio:488 / 680; }
    .tile img { display:block; width:100%; height:100%; object-fit:cover; transition:filter .18s ease, opacity .18s ease; }
    .tile.done img { filter:grayscale(1); opacity:.38; }
    .tile.done::after { content:"✓"; position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-size:clamp(22px,4vw,42px); font-weight:700; text-shadow:0 1px 8px #0008; pointer-events:none; }
    .tile.done { background:#777; }
    .empty { color:var(--muted); padding:40px 12px; text-align:center; }
    @media (max-width:900px) { #grid { grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; } }
    @media (max-width:600px) { .wrap { padding:12px 10px 30px; } header { padding-top:8px; } #grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; } .progress-area { width:100%; } }
    @media (max-width:380px) { #grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="topline">
        <h1>Picture Checklist</h1>
        <div class="actions">
          <button id="reset" type="button" title="Mark every picture as not completed">Reset</button>
        </div>
      </div>
      <div class="progress-area" style="margin-top:12px">
        <span id="counter">Loading…</span>
        <div class="track" aria-label="Completion progress"><div id="bar"></div></div>
      </div>
    </header>
    <section id="grid" aria-label="Picture checklist"></section>
    <noscript>This checklist needs JavaScript enabled.</noscript>
  </main>
  <script>
    (() => {
      const STORAGE_KEY = "picture-checklist-completed-v1";
      const grid = document.getElementById("grid");
      const counter = document.getElementById("counter");
      const bar = document.getElementById("bar");
      let completed = new Set();

      try {
        completed = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
      } catch (_) {}

      function save() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...completed])); }
        catch (_) { counter.textContent = `${completed.size} completed · browser storage unavailable`; }
      }

      function updateProgress(total) {
        const done = Math.min(completed.size, total);
        counter.textContent = `${done} / ${total} completed`;
        bar.style.width = total ? `${done / total * 100}%` : "0%";
      }

      function toggle(path, tile, total) {
        if (completed.has(path)) {
          completed.delete(path);
          tile.classList.remove("done");
          tile.setAttribute("aria-pressed", "false");
        } else {
          completed.add(path);
          tile.classList.add("done");
          tile.setAttribute("aria-pressed", "true");
        }
        save();
        updateProgress(total);
      }

      fetch("./images.json")
        .then(response => {
          if (!response.ok) throw new Error("Could not load images.json");
          return response.json();
        })
        .then(images => {
          if (!Array.isArray(images)) throw new Error("Invalid image list");
          if (!images.length) {
            grid.innerHTML = '<p class="empty">No pictures found.</p>';
            updateProgress(0);
            return;
          }
          const fragment = document.createDocumentFragment();
          images.forEach((path, index) => {
            const tile = document.createElement("button");
            tile.type = "button";
            tile.className = "tile" + (completed.has(path) ? " done" : "");
            tile.setAttribute("aria-label", `Picture ${index + 1}`);
            tile.setAttribute("aria-pressed", completed.has(path) ? "true" : "false");
            const img = document.createElement("img");
            img.src = path;
            img.alt = "";
            img.loading = index < 15 ? "eager" : "lazy";
            img.decoding = "async";
            tile.appendChild(img);
            tile.addEventListener("click", () => toggle(path, tile, images.length));
            fragment.appendChild(tile);
          });
          grid.appendChild(fragment);
          updateProgress(images.length);
        })
        .catch(error => {
          console.error(error);
          grid.innerHTML = '<p class="empty">Could not load the picture list. Make sure images.json and the images folder are in the same repository as this page.</p>';
          counter.textContent = "Unable to load";
        });

      document.getElementById("reset").addEventListener("click", () => {
        if (!completed.size) return;
        if (!confirm("Reset all completed pictures?")) return;
        completed.clear();
        document.querySelectorAll(".tile.done").forEach(tile => {
          tile.classList.remove("done");
          tile.setAttribute("aria-pressed", "false");
        });
        save();
        const total = document.querySelectorAll(".tile").length;
        updateProgress(total);
      });
    })();
  </script>
</body>
</html>
